[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speccheck"
version = "0.1.0"
description = "SpecCheck - voice-driven visual QA agent for hands-on assembly"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["speccheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
